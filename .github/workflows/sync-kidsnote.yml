name: 키즈노트 알림장·공지사항 자동 동기화

on:
  schedule:
    # 매일 한국시간(KST) 오전 8시, 낮 12시, 오후 4시, 저녁 7시, 밤 9시 자동 동기화
    - cron: '0 23,3,7,10,12 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 언제든 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install requests

      - name: 키즈노트 최신 알림장·공지사항 조회 및 AI 준비물 추출
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIDSNOTE_USERNAME: ${{ secrets.KIDSNOTE_USERNAME }}
          KIDSNOTE_PASSWORD: ${{ secrets.KIDSNOTE_PASSWORD }}
        run: python scripts/sync_kidsnote.py

      - name: 변경 사항 자동 커밋 및 배포
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain kidsnote-data.json) ]]; then
            git add kidsnote-data.json
            git commit -m "chore: 키즈노트 신규 알림장·공지사항 자동 동기화"
            git push
          else
            echo "새로 추가된 알림장이나 공지사항이 없습니다."
          fi
