<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="키즈노트비서">
<title>키즈노트 비서</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel2:#f9fafc; --line:#e6e9f0; --line2:#eff1f6;
  --tx:#181d27; --tx2:#3d4557; --mute:#6e778c; --mute2:#8c95a6;
  --acc:#ff7a00; --acc2:#ff5e00; --acc-soft:#fff3e6;
  --ok:#12b76a; --blue:#1a73e8; --naver:#03c75a; --rose:#f04438;
}
*{box-sizing:border-box}
html,body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%; line-height:1.5;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
.shell{display:flex;min-height:100vh}
.side{
  display:none; flex:0 0 220px; background:var(--panel); border-right:1px solid var(--line);
  padding:22px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font-weight:800;font-size:16px}
.brand i{
  width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a00,#ff5e00);
  color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:18px;
}
.side a{
  display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;
  color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:4px;
}
.side a.on{background:var(--acc-soft);color:var(--acc2);font-weight:800}
main{flex:1;min-width:0;padding:0 0 calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.tabbar{
  position:fixed; left:0; right:0; bottom:0;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,0.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(4,1fr); z-index:20;
}
.tabbar a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--mute2);text-decoration:none;font-size:11px;font-weight:600;
}
.tabbar a .ico{font-size:19px;line-height:1}
.tabbar a.on{color:var(--acc2);font-weight:800}
.app-top{
  background:linear-gradient(135deg,#ff8a00 0%,#ff5e00 100%);
  color:#fff; border-radius:18px; padding:16px 18px; margin-bottom:14px;
  box-shadow:0 8px 20px rgba(255,110,0,.18);
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
}
.app-top h1{font-size:1.2rem;font-weight:800}
.app-top .sub{font-size:0.82rem;opacity:0.93;margin-top:2px}
.live-pill{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);
  padding:6px 11px;border-radius:99px;font-size:12px;font-weight:700;border:0;color:#fff;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:#7fffb2}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(15,23,42,.03);
}
.install-bar{
  background:#fff8f0; border:1.5px solid #ff9d42; border-radius:16px;
  padding:14px 16px; margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--tx);font-size:13.5px;font-weight:700;text-decoration:none;
}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:#1f2430;border-color:#1f2430;color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.naver{background:var(--naver);border-color:var(--naver);color:#fff}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--panel);color:var(--mute);font-size:13px;font-weight:700;
}
.seg button.on{background:#1f2430;border-color:#1f2430;color:#fff}
.date-group{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  margin-bottom:12px; overflow:hidden; box-shadow:0 2px 8px rgba(15,23,42,.03);
}
.date-head{
  background:#f8faff; padding:12px 15px; border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
}
.date-title{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-weight:800;font-size:15px}
.dday{
  padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:800;
  background:#eef2ff;color:#3538cd;
}
.dday.today{background:#fee4e2;color:#b42318}
.dday.tomorrow{background:#fff0db;color:#b54708}
.event-pill{
  background:var(--acc-soft);color:#c95200;padding:2px 9px;border-radius:99px;
  font-size:12px;font-weight:700;
}
.cal-actions{display:flex;gap:5px;flex-wrap:wrap}
.check-list{padding:4px 15px}
.check-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px dashed var(--line2);
}
.check-item:last-child{border-bottom:0}
.check-left{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
.check-left input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none;cursor:pointer}
.check-item.checked .item-text{text-decoration:line-through;color:var(--mute2)}
.badge{
  padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:800;white-space:nowrap;flex:none;
}
.badge-준비물{background:#fff0db;color:#b54708}
.badge-복장{background:#e0f2fe;color:#026aa2}
.badge-해야할일{background:#fee4e2;color:#b42318}
.badge-행사{background:#dcfae6;color:#067647}
.summary-box{background:var(--panel2);padding:10px 12px;border-radius:10px;font-size:13.5px;margin:8px 0}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1f2430;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;
  z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.22);display:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
@media (min-width:1024px){
  .side{display:block}
  .tabbar{display:none}
  main{padding-bottom:32px}
  .wrap{padding:22px 26px}
  .toast{bottom:26px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="메뉴">
    <div class="brand"><i>🎒</i>키즈노트 비서</div>
    <nav id="sidenav">
      <a href="#checklist" data-tab="checklist" class="on">✅ 챙길 것</a>
      <a href="#calendar" data-tab="calendar">📅 전체 일정</a>
      <a href="#posts" data-tab="posts">📄 알림장·공지</a>
      <a href="#settings" data-tab="settings">📲 앱 설치·설정</a>
    </nav>
  </aside>
  <main>
    <div class="wrap">
      <div class="app-top">
        <div>
          <h1>🎒 키즈노트 준비물 비서</h1>
          <div class="sub" id="syncTimeText">데이터 불러오는 중...</div>
        </div>
        <button class="live-pill" onclick="loadData(true)">
          <span class="live-dot"></span>
          <span>새로고침</span>
        </button>
      </div>

      <!-- 안드로이드/크롬 앱 설치 유도 배너 (미설치 시 자동 표시) -->
      <div class="install-bar" id="installBanner" style="display:none;">
        <div>
          <strong style="font-size:14.5px;color:#c95200;">📲 진짜 핸드폰 어플로 설치할 수 있어요!</strong>
          <div style="font-size:12.5px;color:var(--tx2);">설치하면 웹창 없이 바탕화면 아이콘으로 바로 열립니다.</div>
        </div>
        <button class="btn pri" onclick="triggerInstall()">지금 앱 설치</button>
      </div>

      <div id="viewContainer"></div>
    </div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
  <a href="#checklist" data-tab="checklist" class="on"><span class="ico">✅</span><span>챙길것</span></a>
  <a href="#calendar" data-tab="calendar"><span class="ico">📅</span><span>전체일정</span></a>
  <a href="#posts" data-tab="posts"><span class="ico">📄</span><span>알림장·공지</span></a>
  <a href="#settings" data-tab="settings"><span class="ico">📲</span><span>앱설치·설정</span></a>
</nav>

<div class="toast" id="toastBox"></div>

<script>
const APP_VER = 'v2';
const PERMANENT_URL = 'https://yoojonglee15.github.io/kidsnote-helper/';
let rawData = { updated_at: '', child_info: '', items: [], posts: [] };
let currentTab = 'checklist';
let showPast = false;
let catFilter = '전체';
let postFilter = '전체';
let deferredPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone()) {
    document.getElementById('installBanner').style.display = 'flex';
  }
  if (currentTab === 'settings') render();
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('installBanner').style.display = 'none';
  showToast('🎉 키즈노트 비서 앱이 설치되었습니다!');
  if (currentTab === 'settings') render();
});

async function triggerInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('installBanner').style.display = 'none';
    }
    deferredPrompt = null;
  } else {
    showToast('브라우저 메뉴(⋮ 또는 三) → [앱 설치] 또는 [홈 화면에 추가]를 눌러주세요!');
  }
}

function getCheckedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('kn_checked') || '[]')); }
  catch { return new Set(); }
}
function saveCheckedSet(s) {
  localStorage.setItem('kn_checked', JSON.stringify(Array.from(s)));
}
function getDeletedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('kn_deleted') || '[]')); }
  catch { return new Set(); }
}
function saveDeletedSet(s) {
  localStorage.setItem('kn_deleted', JSON.stringify(Array.from(s)));
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getDdayBadge(dateStr) {
  const todayStr = new Date().toLocaleDateString('sv-SE');
  const d1 = new Date(todayStr + 'T00:00:00');
  const d2 = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((d2 - d1) / 86400000);
  if (diff === 0) return '<span class="dday today">오늘</span>';
  if (diff === 1) return '<span class="dday tomorrow">내일</span>';
  if (diff > 1) return `<span class="dday">D-${diff}</span>`;
  return `<span class="dday" style="background:#f2f4f7;color:#667085;">지난일정</span>`;
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('[data-tab]').forEach(a => {
    a.classList.toggle('on', a.dataset.tab === tab);
  });
  render();
  window.scrollTo(0, 0);
}

function syncRouteFromHash() {
  const h = (location.hash || '#checklist').replace('#', '');
  if (['checklist', 'calendar', 'posts', 'settings'].includes(h)) {
    currentTab = h;
  } else {
    currentTab = 'checklist';
  }
  document.querySelectorAll('[data-tab]').forEach(a => {
    a.classList.toggle('on', a.dataset.tab === currentTab);
  });
}

window.addEventListener('hashchange', () => {
  syncRouteFromHash();
  render();
  window.scrollTo(0, 0);
});

function toggleCheck(id, checked) {
  const s = getCheckedSet();
  if (checked) s.add(id); else s.delete(id);
  saveCheckedSet(s);
  render();
}

function hideItem(id) {
  const s = getDeletedSet();
  s.add(id);
  saveDeletedSet(s);
  render();
}

function downloadIcs(targetDate) {
  const checkedSet = getCheckedSet();
  const deletedSet = getDeletedSet();
  const todayStr = new Date().toLocaleDateString('sv-SE');
  const items = (rawData.items || []).filter(it => {
    if (deletedSet.has(it.id)) return false;
    if (targetDate) return it.target_date === targetDate;
    return it.target_date >= todayStr && !checkedSet.has(it.id);
  });
  if (items.length === 0) { showToast('달력에 추가할 일정이 없습니다.'); return; }

  const grouped = {};
  items.forEach(it => {
    if (!grouped[it.target_date]) grouped[it.target_date] = { titles: new Set(), list: [] };
    if (it.event_title) grouped[it.target_date].titles.add(it.event_title);
    grouped[it.target_date].list.push(it);
  });

  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//KidsNote Helper//KR',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:키즈노트 준비물·일정', 'X-WR-TIMEZONE:Asia/Seoul'
  ];
  const nowUtc = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

  Object.keys(grouped).sort().forEach(dStr => {
    const g = grouped[dStr];
    const dtStart = dStr.replace(/-/g, '');
    const nextObj = new Date(dStr + 'T00:00:00');
    nextObj.setDate(nextObj.getDate() + 1);
    const dtEnd = nextObj.toISOString().slice(0, 10).replace(/-/g, '');
    const mainTitle = Array.from(g.titles).slice(0, 2).join(', ') || '어린이집 일정';
    const summary = `[키즈노트] ${mainTitle}`;
    const desc = g.list.map(i => `[${i.category}] ${i.item_text}`).join('\\n');

    lines.push(
      'BEGIN:VEVENT', `UID:kn-${dtStart}-${Math.abs(summary.length)}@kidsnote`,
      `DTSTAMP:${nowUtc}`, `DTSTART;VALUE=DATE:${dtStart}`, `DTEND;VALUE=DATE:${dtEnd}`,
      `SUMMARY:${summary}`, `DESCRIPTION:${desc}`,
      'BEGIN:VALARM', 'TRIGGER:-PT4H', 'ACTION:DISPLAY', `DESCRIPTION:내일 ${summary} 준비물 확인!`, 'END:VALARM',
      'BEGIN:VALARM', 'TRIGGER:PT7H30M', 'ACTION:DISPLAY', `DESCRIPTION:오늘 ${summary} 확인!`, 'END:VALARM',
      'END:VEVENT'
    );
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kidsnote_${targetDate || 'all'}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openGoogleGalaxyCalendar(dateStr, title, items) {
  const d = dateStr.replace(/-/g, '');
  const nextObj = new Date(dateStr + 'T00:00:00');
  nextObj.setDate(nextObj.getDate() + 1);
  const nextD = nextObj.toISOString().slice(0, 10).replace(/-/g, '');
  const summary = encodeURIComponent(`[키즈노트] ${title}`);
  const details = encodeURIComponent(items.map(i => `[${i.category}] ${i.item_text}`).join('\n'));
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${summary}&dates=${d}/${nextD}&details=${details}`, '_blank');
}

function openNaverCalendar(dateStr, title, items) {
  const copyText = `${dateStr} [키즈노트] ${title}\n` + items.map(i => `[${i.category}] ${i.item_text}`).join('\n');
  navigator.clipboard.writeText(copyText).catch(() => {});
  showToast('📋 일정이 복사되었습니다! 네이버 캘린더에 붙여넣으세요.');
  window.open('https://calendar.naver.com/', '_blank');
}

function renderChecklistView(onlyUpcomingMode) {
  const checkedSet = getCheckedSet();
  const deletedSet = getDeletedSet();
  const todayStr = new Date().toLocaleDateString('sv-SE');
  const allValid = (rawData.items || []).filter(it => !deletedSet.has(it.id));
  const upcoming = allValid.filter(it => it.target_date >= todayStr);
  const pastCount = allValid.length - upcoming.length;

  let baseItems = onlyUpcomingMode ? (showPast ? allValid : upcoming) : allValid;
  if (catFilter !== '전체') {
    baseItems = baseItems.filter(it => it.category === catFilter);
  }

  const cats = ['전체', '준비물', '복장', '해야할일', '행사'];
  const catButtons = cats.map(c =>
    `<button class="${catFilter===c?'on':''}" onclick="catFilter='${c}';render()">${c}</button>`
  ).join('');

  let topBar = `
    <div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="seg">${catButtons}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${onlyUpcomingMode ? `<button class="btn sm" onclick="showPast=!showPast;render()">${showPast ? `🙈 지난 날짜 숨기기` : `🕰️ 지난 일정 (${pastCount})`}</button>` : ''}
          <button class="btn dark sm" onclick="downloadIcs(null)">📱 전체 달력(.ics)</button>
        </div>
      </div>
    </div>
  `;

  if (baseItems.length === 0) {
    return topBar + `
      <div class="card empty">
        <div style="font-size:2.2rem;margin-bottom:6px;">🎒</div>
        <h3 style="margin-bottom:6px;color:var(--tx);">해당 조건의 준비물·일정이 없습니다!</h3>
        <p style="margin:0;font-size:13.5px;">필터를 '전체'로 바꾸거나 지난 일정을 확인해 보세요.</p>
      </div>
    `;
  }

  const grouped = {};
  baseItems.forEach(it => {
    if (!grouped[it.target_date]) grouped[it.target_date] = { date_label: it.date_label || it.target_date, titles: new Set(), list: [] };
    if (it.event_title) grouped[it.target_date].titles.add(it.event_title);
    grouped[it.target_date].list.push(it);
  });

  const iconMap = { '준비물': '🎒 준비물', '복장': '👕 복장', '해야할일': '✍️ 해야할일', '행사': '🎈 행사' };
  const dates = Object.keys(grouped).sort();
  if (!onlyUpcomingMode) dates.reverse();

  let listHtml = '';
  dates.forEach(dateStr => {
    const g = grouped[dateStr];
    const mainTitle = Array.from(g.titles).slice(0, 2).join(', ') || '어린이집 일정';
    const itemsJson = JSON.stringify(g.list).replace(/"/g, '&quot;');

    listHtml += `
      <div class="date-group">
        <div class="date-head">
          <div class="date-title">
            ${getDdayBadge(dateStr)}
            <span>${esc(g.date_label)}</span>
            <span class="event-pill">${esc(mainTitle)}</span>
          </div>
          <div class="cal-actions">
            <button class="btn dark sm" onclick="downloadIcs('${dateStr}')">📱 삼성달력</button>
            <button class="btn blue sm" onclick="openGoogleGalaxyCalendar('${dateStr}', '${esc(mainTitle).replace(/'/g,"")}', ${itemsJson})">구글</button>
            <button class="btn naver sm" onclick="openNaverCalendar('${dateStr}', '${esc(mainTitle).replace(/'/g,"")}', ${itemsJson})">네이버</button>
          </div>
        </div>
        <div class="check-list">
    `;

    g.list.forEach(item => {
      const isChecked = checkedSet.has(item.id) || Boolean(item.is_checked);
      listHtml += `
        <div class="check-item ${isChecked?'checked':''}">
          <label class="check-left">
            <input type="checkbox" ${isChecked?'checked':''} onchange="toggleCheck(${item.id}, this.checked)" />
            <span class="badge badge-${esc(item.category)}">${iconMap[item.category] || esc(item.category)}</span>
            <span class="item-text">${esc(item.item_text)}</span>
          </label>
          <button class="btn sm" onclick="hideItem(${item.id})" title="숨기기">✕</button>
        </div>
      `;
    });
    listHtml += `</div></div>`;
  });

  return topBar + listHtml;
}

function renderPostsView() {
  const posts = (rawData.posts || []).filter(p => postFilter === '전체' || p.source_type === postFilter);
  const filters = ['전체', '공지사항', '알림장'];
  const filterBar = `
    <div class="card">
      <div class="seg">
        ${filters.map(f => `<button class="${postFilter===f?'on':''}" onclick="postFilter='${f}';render()">${f}</button>`).join('')}
      </div>
    </div>
  `;
  if (posts.length === 0) return filterBar + `<div class="card empty">표시할 글이 없습니다.</div>`;

  return filterBar + posts.map(p => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span class="event-pill">${esc(p.source_type)}</span>
        <span style="font-size:12.5px;color:var(--mute);">${esc(p.post_date)}</span>
      </div>
      <h3 style="font-size:15.5px;margin-bottom:6px;">${esc(p.title)}</h3>
      <div class="summary-box">💡 <b>AI 요약:</b> ${esc(p.summary || '요약 없음')}</div>
      <details style="font-size:13px;color:var(--mute);">
        <summary style="cursor:pointer;font-weight:700;">원본 글 전체 보기</summary>
        <pre style="white-space:pre-wrap;font-family:inherit;margin-top:8px;color:var(--tx2);">${esc(p.content)}</pre>
      </details>
    </div>
  `).join('');
}

function renderSettingsView() {
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=' + encodeURIComponent(PERMANENT_URL);
  const installed = isStandalone();

  return `
    <div class="card">
      <h3 style="margin-bottom:8px;">📲 갤럭시 스마트폰 앱(PWA) 설치 방법</h3>
      <p style="margin:0 0 12px;font-size:13.5px;color:var(--tx2);">
        이 앱은 주식앱(MyStock)과 똑같은 방식으로 작동합니다! 아래 버튼으로 설치하면 브라우저 주소창 없이 <b>진짜 어플</b>처럼 실행되고, 새로 고쳐도 재설치 없이 자동 업데이트됩니다.
      </p>
      ${installed
        ? `<div style="padding:10px 14px;background:#dcfae6;color:#067647;border-radius:10px;font-weight:700;font-size:13.5px;">✅ 현재 설치된 앱 모드로 실행 중입니다!</div>`
        : `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
             <button class="btn pri" onclick="triggerInstall()">📲 지금 바로 앱 설치하기</button>
           </div>
           <div class="summary-box" style="font-size:13px;">
             <b>만약 위 버튼이 안 뜰 때 수동 설치법:</b><br/>
             • <b>삼성 인터넷</b>: 오른쪽 아래 <b>三 메뉴</b> → <b>현재 페이지 추가</b> → <b>홈 화면</b><br/>
             • <b>크롬(Chrome)</b>: 오른쪽 위 <b>⋮ 메뉴</b> → <b>홈 화면에 추가</b> → <b>설치</b>
           </div>`
      }
    </div>

    <div class="card" style="text-align:center;">
      <h3 style="margin-bottom:6px;">📱 내 고정 주소 & QR코드</h3>
      <p style="margin:0 0 10px;font-size:13px;color:var(--mute);">카메라로 찍으면 언제든 열립니다.</p>
      <img src="${qrUrl}" alt="QR" style="width:180px;height:180px;border-radius:12px;border:1px solid var(--line);padding:6px;background:#fff;" />
      <div style="margin-top:8px;font-size:13px;font-weight:800;color:var(--acc2);word-break:break-all;">${PERMANENT_URL}</div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px;">⚙️ 동기화 & 데이터 관리</h3>
      <div style="font-size:13.5px;color:var(--tx2);margin-bottom:12px;">
        • 앱 버전: <b>${APP_VER}</b><br/>
        • 자동 업데이트: 매일 오전 8시 · 12시 · 오후 4시 · 저녁 7시 · 밤 9시<br/>
        • 마지막 동기화: <b>${esc(rawData.updated_at || '-')}</b>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn pri sm" onclick="loadData(true)">🔄 지금 최신 데이터 받기</button>
        <button class="btn sm" onclick="localStorage.removeItem('kn_checked');localStorage.removeItem('kn_deleted');showToast('체크/숨김 기록을 초기화했습니다.');render();">🧹 내 체크 기록 초기화</button>
      </div>
    </div>
  `;
}

function render() {
  const box = document.getElementById('viewContainer');
  if (currentTab === 'checklist') box.innerHTML = renderChecklistView(true);
  else if (currentTab === 'calendar') box.innerHTML = renderChecklistView(false);
  else if (currentTab === 'posts') box.innerHTML = renderPostsView();
  else box.innerHTML = renderSettingsView();
}

async function loadData(notify = false) {
  try {
    const res = await fetch('./kidsnote-data.json?t=' + Date.now(), { cache: 'no-store' });
    rawData = await res.json();
    document.getElementById('syncTimeText').textContent =
      `${rawData.child_info || '키즈노트'} · 업데이트 ${rawData.updated_at || ''}`;
    render();
    if (notify) showToast('✅ 최신 알림장·공지사항을 불러왔습니다!');
  } catch (e) {
    showToast('데이터를 불러오지 못했습니다.');
  }
}

syncRouteFromHash();
loadData();

// 앱을 다시 열 때마다 자동으로 최신 데이터 및 앱 업데이트 확인
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    loadData(false);
  }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r => {
    r.update().catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) r.update().catch(() => {});
    });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadCtl && !reloaded) { reloaded = true; location.reload(); }
  });
}
</script>
</body>
</html>
