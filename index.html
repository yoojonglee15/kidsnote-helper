<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="키즈노트비서">
<title>주원이 준비물 수첩</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FAF8F5; --panel:#FFFFFF; --panel2:#F7F4EF; --line:#EFEAE2; --line2:#F4F0EA;
  --tx:#1F1B18; --tx2:#585049; --mute:#8D837A; --mute2:#B2A89F;
  --acc:#FF7A2F; --acc2:#D95C14; --acc-soft:#FFF0E5;
  --ok:#168053; --blue:#1D56B8; --naver:#03C75A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%; line-height:1.45;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
.shell{display:flex;min-height:100vh}
.side{
  display:none; flex:0 0 228px; background:var(--panel); border-right:1px solid var(--line);
  padding:22px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font-weight:800;font-size:15.5px}
.brand i{
  width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#FF9A52,#FF6B35);
  color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:18px;
}
.side a{
  display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:12px;
  color:var(--mute);text-decoration:none;font-size:14px;font-weight:700;margin-bottom:4px;
}
.side a.on{background:var(--acc-soft);color:var(--acc2);font-weight:800}
main{flex:1;min-width:0;padding:0 0 calc(86px + env(safe-area-inset-bottom))}
.wrap{max-width:780px;margin:0 auto;padding:14px 14px}

/* 하단 앱 탭바 */
.tabbar{
  position:fixed; left:0; right:0; bottom:0;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,0.97); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(4,1fr); z-index:20;
}
.tabbar a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--mute2);text-decoration:none;font-size:11px;font-weight:700;
}
.tabbar a .ico{font-size:19px;line-height:1}
.tabbar a.on{color:var(--acc);font-weight:800}

/* 상단 헤더 */
.top-bar{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:4px 2px 12px;
}
.profile-box{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{
  width:40px;height:40px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#FF9A52,#FF6B35);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 12px rgba(255,122,47,0.22);
}
.profile-title{font-size:17.5px;font-weight:800;letter-spacing:-0.4px}
.profile-sub{font-size:11.5px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:6px;flex:none}
.progress-pill{
  background:var(--acc-soft);color:var(--acc2);font-size:11.5px;font-weight:800;
  padding:5px 10px;border-radius:99px;white-space:nowrap;
}
.icon-btn{
  background:var(--panel);border:1px solid var(--line);color:var(--tx2);
  width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;
}

/* 주간 미니 달력 */
.week-strip{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:11px 10px; margin-bottom:12px;
  box-shadow:0 2px 10px rgba(40,30,20,0.03);
}
.week-top{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 4px 8px;font-size:12.5px;font-weight:800;color:var(--tx2);
}
.week-nav{display:flex;gap:4px}
.week-nav button{
  background:var(--panel2);border:0;border-radius:8px;
  padding:4px 9px;font-size:11.5px;font-weight:700;color:var(--tx2);
}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.day-chip{
  border:0;background:transparent;border-radius:12px;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--mute);font-size:10.5px;font-weight:600;
}
.day-chip .num{font-size:13.5px;font-weight:800;color:var(--tx)}
.day-chip.today{background:var(--acc-soft);color:var(--acc2)}
.day-chip.today .num{color:var(--acc2)}
.day-chip.selected{background:var(--acc);color:#fff}
.day-chip.selected .num{color:#fff}
.day-dot{width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:0}
.day-chip.has-event .day-dot{opacity:1}
.day-chip.selected .day-dot{background:#fff}

/* 필터 & 공통 카드 */
.filter-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{
  height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--panel);color:var(--mute);font-size:12px;font-weight:700;
}
.seg button.on{background:var(--tx);border-color:var(--tx);color:#fff}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(40,30,20,0.03);
}
.install-bar{
  background:var(--acc-soft); border:1px solid #FFCCA8; border-radius:16px;
  padding:12px 14px; margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
}

/* 정돈된 날짜 그룹 카드 */
.date-card{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  margin-bottom:12px; overflow:hidden; box-shadow:0 2px 10px rgba(40,30,20,0.03);
}
.date-card-head{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:12px 15px; background:#FDFBF8; border-bottom:1px solid var(--line2);
}
.date-left{display:flex;align-items:center;gap:7px;min-width:0}
.dday{
  padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;
  background:var(--panel2);color:var(--tx2);flex:none;
}
.dday.today{background:var(--acc);color:#fff}
.dday.tomorrow{background:var(--acc-soft);color:var(--acc2)}
.date-str{font-size:14px;font-weight:800;color:var(--tx)}

.cal-trigger{
  background:var(--panel); border:1px solid var(--line); color:var(--tx2);
  height:28px; padding:0 10px; border-radius:8px; font-size:11.5px; font-weight:700;
  display:inline-flex; align-items:center; gap:4px; flex:none;
}

/* 깔끔한 할 일 행: 왼쪽 체크 원 / 오른쪽 본문 탭 시 원문 시트 열기 */
.todo-row{
  display:flex; align-items:flex-start; gap:4px;
  padding:11px 12px 11px 8px;
  border-bottom:1px solid var(--line2);
  transition:background 0.12s ease;
}
.todo-row:last-child{border-bottom:0}
.todo-row.checked{opacity:0.52}
.todo-row.checked .todo-title{text-decoration:line-through;color:var(--mute)}

.check-hit{
  width:38px; height:38px; margin-top:-4px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:0; padding:0;
}
.check-circle{
  width:21px; height:21px; border-radius:50%;
  border:2px solid #D2C8BE; background:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:900; color:#fff;
  transition:all 0.15s ease;
}
.todo-row.checked .check-circle{
  background:var(--acc); border-color:var(--acc);
}

.todo-body{
  flex:1; min-width:0; cursor:pointer; padding:1px 4px;
}
.todo-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.todo-title{font-size:14px;font-weight:700;color:var(--tx);word-break:keep-all}
.cat-tag{
  font-size:10.5px; font-weight:800; padding:1.5px 6px; border-radius:5px; flex:none;
}
.cat-준비물{background:#E3F6EC;color:#14784D}
.cat-복장{background:#E3EEFF;color:#1D56B8}
.cat-해야할일{background:#FFE7DA;color:#C24D00}
.cat-행사{background:#EFE5FF;color:#6833B5}

.todo-detail{
  font-size:12.5px; color:var(--tx2); margin-top:3px; line-height:1.4;
}
.contact-chips{
  display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;
}
.contact-pill{
  display:inline-flex; align-items:center; gap:5px;
  background:#FFF5EC; border:1px solid #FAD9BF; color:#B84D00;
  padding:4px 9px; border-radius:8px; font-size:11.5px; font-weight:700;
  text-decoration:none;
}
.copy-mini{
  background:#F4F0EA; border:0; color:var(--tx2);
  padding:4px 8px; border-radius:8px; font-size:11px; font-weight:700;
}
.todo-chevron{
  color:var(--mute2); font-size:18px; padding:4px 2px 0 4px; flex:none; cursor:pointer;
}

/* 버튼 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--tx);font-size:13px;font-weight:700;text-decoration:none;
}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.soft{background:var(--acc-soft);border-color:#FFDCC2;color:var(--acc2)}
.btn.sm{height:30px;padding:0 10px;font-size:11.5px;border-radius:8px}

/* 바텀 시트 (알림장 원문 보기 / 캘린더 선택) */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(20,16,12,0.45); z-index:40;
  display:none; align-items:flex-end; justify-content:center;
}
.sheet-backdrop.open{display:flex}
.sheet{
  background:var(--panel); width:100%; max-width:620px; max-height:86vh;
  border-top-left-radius:24px; border-top-right-radius:24px;
  padding:12px 18px calc(20px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:12px;
  box-shadow:0 -10px 30px rgba(0,0,0,0.18);
  animation:slideUp 0.18s ease-out;
}
@keyframes slideUp{from{transform:translateY(28px);opacity:0.5}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:38px;height:4px;border-radius:99px;background:#DDD6CE;margin:0 auto 2px;flex:none}
.sheet-scroll{overflow-y:auto;flex:1;padding-right:2px}
.sheet-title{font-size:16.5px;font-weight:800;color:var(--tx);margin-top:4px}
.sheet-meta{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.sheet-box{
  background:var(--panel2); border:1px solid var(--line); border-radius:14px;
  padding:12px; font-size:13px; color:var(--tx2); margin-top:10px;
}
.sheet-raw{
  background:#fff; border:1px solid var(--line); border-radius:14px;
  padding:13px; font-size:13.5px; color:var(--tx); line-height:1.6;
  white-space:pre-wrap; margin-top:10px;
}
.sheet-imgs img{
  width:100%; border-radius:12px; border:1px solid var(--line); margin-top:10px; display:block;
}
.sheet-actions{display:flex;gap:8px;padding-top:6px;border-top:1px solid var(--line2);flex:none}

.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#2B241E;color:#fff;padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:700;
  z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.22);display:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
@media (min-width:1024px){
  .side{display:block}
  .tabbar{display:none}
  main{padding-bottom:32px}
  .wrap{padding:22px 26px}
  .sheet{border-radius:22px;margin-bottom:24px}
  .sheet-backdrop{align-items:center}
  .toast{bottom:26px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="메뉴">
    <div class="brand"><i>🐝</i>주원이 준비물 수첩</div>
    <nav id="sidenav">
      <a href="#checklist" data-tab="checklist" class="on">🎒 오늘 준비</a>
      <a href="#calendar" data-tab="calendar">🗓️ 전체 일정</a>
      <a href="#posts" data-tab="posts">💌 알림장·공지</a>
      <a href="#settings" data-tab="settings">⚙️ 앱 설치·더보기</a>
    </nav>
  </aside>
  <main>
    <div class="wrap">
      <div class="top-bar">
        <div class="profile-box">
          <div class="avatar">🐝</div>
          <div style="min-width:0;">
            <div class="profile-title">주원이 준비물 수첩</div>
            <div class="profile-sub" id="syncTimeText">Honeybees · 불러오는 중...</div>
          </div>
        </div>
        <div class="header-right">
          <span class="progress-pill" id="progressPill">0/0 완료</span>
          <button class="icon-btn" onclick="loadData(true)" title="새로고침">↻</button>
        </div>
      </div>

      <div class="install-bar" id="installBanner" style="display:none;">
        <div>
          <strong style="font-size:13.5px;color:var(--acc2);">📲 핸드폰 바탕화면에 앱으로 설치하기</strong>
          <div style="font-size:12px;color:var(--tx2);">설치하면 웹창 없이 아이콘으로 바로 열려요.</div>
        </div>
        <button class="btn pri sm" onclick="triggerInstall()">앱 설치</button>
      </div>

      <div id="viewContainer"></div>
    </div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
  <a href="#checklist" data-tab="checklist" class="on"><span class="ico">🎒</span><span>오늘준비</span></a>
  <a href="#calendar" data-tab="calendar"><span class="ico">🗓️</span><span>전체일정</span></a>
  <a href="#posts" data-tab="posts"><span class="ico">💌</span><span>알림장</span></a>
  <a href="#settings" data-tab="settings"><span class="ico">⚙️</span><span>더보기</span></a>
</nav>

<!-- 관련 알림장 원본 & 연락처 바텀 시트 -->
<div class="sheet-backdrop" id="detailSheet" onclick="if(event.target===this) closeDetailSheet()">
  <div class="sheet" id="detailSheetBody"></div>
</div>

<!-- 캘린더 등록 선택 바텀 시트 -->
<div class="sheet-backdrop" id="calSheet" onclick="if(event.target===this) closeCalSheet()">
  <div class="sheet" id="calSheetBody"></div>
</div>

<div class="toast" id="toastBox"></div>

<script>
const APP_VER = 'v4';
const PERMANENT_URL = 'https://yoojonglee15.github.io/kidsnote-helper/';
let rawData = { updated_at: '', child_info: '', center_phone: '', items: [], posts: [] };
let currentTab = 'checklist';
let showPast = false;
let catFilter = '전체';
let postFilter = '전체';
let weekOffset = 0;
let selectedDateFilter = '';
let deferredPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone()) document.getElementById('installBanner').style.display = 'flex';
  if (currentTab === 'settings') render();
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('installBanner').style.display = 'none';
  showToast('🎉 주원이 준비물 수첩 앱이 설치되었습니다!');
  if (currentTab === 'settings') render();
});

async function triggerInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') document.getElementById('installBanner').style.display = 'none';
    deferredPrompt = null;
  } else {
    showToast('브라우저 메뉴(⋮ 또는 三) → [홈 화면에 추가] 또는 [앱 설치]를 눌러주세요!');
  }
}

function getCheckedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('kn_checked') || '[]')); }
  catch { return new Set(); }
}
function saveCheckedSet(s) { localStorage.setItem('kn_checked', JSON.stringify(Array.from(s))); }

function getDeletedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('kn_deleted') || '[]')); }
  catch { return new Set(); }
}
function saveDeletedSet(s) { localStorage.setItem('kn_deleted', JSON.stringify(Array.from(s))); }

function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2800);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => {
    showToast(`📋 ${label || text} 복사되었습니다!`);
  }).catch(() => {
    showToast(text);
  });
}

function getTodayStr() { return new Date().toLocaleDateString('sv-SE'); }

function getDdayBadge(dateStr) {
  const d1 = new Date(getTodayStr() + 'T00:00:00');
  const d2 = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((d2 - d1) / 86400000);
  if (diff === 0) return '<span class="dday today">오늘</span>';
  if (diff === 1) return '<span class="dday tomorrow">내일</span>';
  if (diff > 1) return `<span class="dday">D-${diff}</span>`;
  return `<span class="dday">지난일정</span>`;
}

function formatKoreanDate(dateStr) {
  try {
    const dt = new Date(dateStr + 'T00:00:00');
    const dow = ['일', '월', '화', '수', '목', '금', '토'][dt.getDay()];
    return `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${dow})`;
  } catch { return dateStr; }
}

function syncRouteFromHash() {
  const h = (location.hash || '#checklist').replace('#', '');
  currentTab = ['checklist', 'calendar', 'posts', 'settings'].includes(h) ? h : 'checklist';
  document.querySelectorAll('[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === currentTab));
}

window.addEventListener('hashchange', () => { syncRouteFromHash(); render(); window.scrollTo(0, 0); });

function toggleCheck(id) {
  const s = getCheckedSet();
  if (s.has(id)) s.delete(id); else s.add(id);
  saveCheckedSet(s);
  render();
}

function hideItem(id) {
  const s = getDeletedSet();
  s.add(id);
  saveDeletedSet(s);
  closeDetailSheet();
  showToast('항목을 목록에서 숨겼습니다.');
  render();
}

function updateProgressPill() {
  const checkedSet = getCheckedSet();
  const deletedSet = getDeletedSet();
  const todayStr = getTodayStr();
  const upcoming = (rawData.items || []).filter(it => !deletedSet.has(it.id) && it.target_date >= todayStr);
  const doneCount = upcoming.filter(it => checkedSet.has(it.id) || Boolean(it.is_checked)).length;
  document.getElementById('progressPill').textContent = `${doneCount}/${upcoming.length} 완료`;
}

function extractPhonesFromText(txt) {
  const matches = String(txt || '').match(/0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4}/g) || [];
  return Array.from(new Set(matches.map(m => m.replace(/\s+/g, '-'))));
}

function openItemDetail(itemId) {
  const item = (rawData.items || []).find(i => i.id === itemId);
  if (!item) return;
  const post = (rawData.posts || []).find(p => p.id === item.post_id);
  const checked = getCheckedSet().has(item.id) || Boolean(item.is_checked);

function getItemsForDate(dateStr) {
  const deletedSet = getDeletedSet();
  return (rawData.items || []).filter(it => !deletedSet.has(it.id) && it.target_date === dateStr);
}

function openGoogleByDate(dateStr) {
  const items = getItemsForDate(dateStr);
  const d = dateStr.replace(/-/g, '');
  const nextObj = new Date(dateStr + 'T00:00:00'); nextObj.setDate(nextObj.getDate() + 1);
  const nextD = nextObj.toISOString().slice(0, 10).replace(/-/g, '');
  const title = Array.from(new Set(items.map(i => i.event_title).filter(Boolean))).slice(0, 2).join(', ') || '어린이집 일정';
  const details = items.map(i => `[${i.category}] ${i.item_text}${i.detail ? ' - ' + i.detail : ''}`).join('\n');
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('[키즈노트] ' + title)}&dates=${d}/${nextD}&details=${encodeURIComponent(details)}`, '_blank');
}

function openNaverByDate(dateStr) {
  const items = getItemsForDate(dateStr);
  const title = Array.from(new Set(items.map(i => i.event_title).filter(Boolean))).slice(0, 2).join(', ') || '어린이집 일정';
  const copyStr = `${dateStr} [키즈노트] ${title}\n` + items.map(i => `[${i.category}] ${i.item_text}${i.detail ? ' - ' + i.detail : ''}`).join('\n');
  copyText(copyStr, '일정 내용');
  window.open('https://calendar.naver.com/', '_blank');
}

function downloadIcs(targetDate) {
  const checkedSet = getCheckedSet();
  const deletedSet = getDeletedSet();
  const todayStr = getTodayStr();
  const items = (rawData.items || []).filter(it => {
    if (deletedSet.has(it.id)) return false;
    if (targetDate) return it.target_date === targetDate;
    return it.target_date >= todayStr && !checkedSet.has(it.id);
  });
  if (items.length === 0) { showToast('달력에 추가할 일정이 없습니다.'); return; }

  const grouped = {};
  items.forEach(it => {
    if (!grouped[it.target_date]) grouped[it.target_date] = { titles: new Set(), list: [] };
    if (it.event_title) grouped[it.target_date].titles.add(it.event_title);
    grouped[it.target_date].list.push(it);
  });

  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//KidsNote Helper//KR',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:주원이 준비물·일정', 'X-WR-TIMEZONE:Asia/Seoul'
  ];
  const nowUtc = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

  Object.keys(grouped).sort().forEach(dStr => {
    const g = grouped[dStr];
    const dtStart = dStr.replace(/-/g, '');
    const nextObj = new Date(dStr + 'T00:00:00'); nextObj.setDate(nextObj.getDate() + 1);
    const dtEnd = nextObj.toISOString().slice(0, 10).replace(/-/g, '');
    const mainTitle = Array.from(g.titles).slice(0, 2).join(', ') || '어린이집 일정';
    const summary = `[키즈노트] ${mainTitle}`;
    const desc = g.list.map(i => `[${i.category}] ${i.item_text}${i.detail ? ' (' + i.detail + ')' : ''}`).join('\\n');

    lines.push(
      'BEGIN:VEVENT', `UID:kn-${dtStart}-${Math.abs(summary.length)}@kidsnote`,
      `DTSTAMP:${nowUtc}`, `DTSTART;VALUE=DATE:${dtStart}`, `DTEND;VALUE=DATE:${dtEnd}`,
      `SUMMARY:${summary}`, `DESCRIPTION:${desc}`,
      'BEGIN:VALARM', 'TRIGGER:-PT4H', 'ACTION:DISPLAY', `DESCRIPTION:내일 ${summary} 준비물 확인!`, 'END:VALARM',
      'BEGIN:VALARM', 'TRIGGER:PT7H30M', 'ACTION:DISPLAY', `DESCRIPTION:오늘 ${summary} 확인!`, 'END:VALARM',
      'END:VEVENT'
    );
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kidsnote_${targetDate || 'all'}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderWeekStrip(allValid) {
  const eventDates = new Set(allValid.map(it => it.target_date));
  const todayStr = getTodayStr();
  const todayObj = new Date(todayStr + 'T00:00:00');
  const dayOfWeek = todayObj.getDay();
  const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  const monday = new Date(todayObj);
  monday.setDate(todayObj.getDate() + mondayOffset + weekOffset * 7);

  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const iso = d.toLocaleDateString('sv-SE');
    days.push({
      iso, dow: ['월', '화', '수', '목', '금', '토', '일'][i],
      dayNum: d.getDate(), month: d.getMonth() + 1,
      isToday: iso === todayStr, hasEvent: eventDates.has(iso), isSelected: selectedDateFilter === iso
    });
  }

  const label = `${days[0].month}월 ${days[0].dayNum}일 ~ ${days[6].month}월 ${days[6].dayNum}일`;
  return `
    <div class="week-strip">
      <div class="week-top">
        <span>🗓️ ${label}</span>
        <div class="week-nav">
          ${selectedDateFilter ? `<button onclick="selectedDateFilter='';render()">전체보기</button>` : ''}
          <button onclick="weekOffset--;render()">‹</button>
          <button onclick="weekOffset=0;selectedDateFilter='';render()">이번주</button>
          <button onclick="weekOffset++;render()">›</button>
        </div>
      </div>
      <div class="week-grid">
        ${days.map(d => `
          <button class="day-chip ${d.isToday?'today':''} ${d.hasEvent?'has-event':''} ${d.isSelected?'selected':''}"
                  onclick="selectedDateFilter=(selectedDateFilter==='${d.iso}'?'':'${d.iso}');render();">
            <span>${d.dow}</span>
            <span class="num">${d.dayNum}</span>
            <span class="day-dot"></span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderChecklistView(onlyUpcomingMode) {
  const checkedSet = getCheckedSet();
  const deletedSet = getDeletedSet();
  const todayStr = getTodayStr();
  const allValid = (rawData.items || []).filter(it => !deletedSet.has(it.id));
  const upcoming = allValid.filter(it => it.target_date >= todayStr);
  const pastCount = allValid.length - upcoming.length;

  let baseItems;
  if (onlyUpcomingMode && selectedDateFilter) baseItems = allValid.filter(it => it.target_date === selectedDateFilter);
  else baseItems = onlyUpcomingMode ? (showPast ? allValid : upcoming) : allValid;

  if (catFilter !== '전체') baseItems = baseItems.filter(it => it.category === catFilter);

  const cats = ['전체', '준비물', '복장', '해야할일', '행사'];
  let html = onlyUpcomingMode ? renderWeekStrip(allValid) : '';

  html += `
    <div class="filter-bar">
      <div class="seg">
        ${cats.map(c => `<button class="${catFilter===c?'on':''}" onclick="catFilter='${c}';render()">${c}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${onlyUpcomingMode && !selectedDateFilter ? `<button class="btn sm" onclick="showPast=!showPast;render()">${showPast ? '🙈 지난일정 숨김' : `지난일정 (${pastCount})`}</button>` : ''}
        <button class="btn soft sm" onclick="openCalSheet(null)">📅 전체 달력</button>
      </div>
    </div>
  `;

  if (baseItems.length === 0) {
    return html + `
      <div class="card empty">
        <div style="font-size:2.1rem;margin-bottom:6px;">🌷</div>
        <h3 style="margin-bottom:4px;color:var(--tx);">${selectedDateFilter ? `${formatKoreanDate(selectedDateFilter)}에는 준비물이 없어요!` : '표시할 준비물·일정이 없습니다!'}</h3>
        <p style="margin:0;font-size:12.5px;">다른 날짜나 필터를 선택해 보세요.</p>
      </div>
    `;
  }

  const grouped = {};
  baseItems.forEach(it => {
    if (!grouped[it.target_date]) grouped[it.target_date] = [];
    grouped[it.target_date].push(it);
  });

  const dates = Object.keys(grouped).sort();
  if (!onlyUpcomingMode) dates.reverse();

  dates.forEach(dateStr => {
    const list = grouped[dateStr];
    html += `
      <div class="date-card">
        <div class="date-card-head">
          <div class="date-left">
            ${getDdayBadge(dateStr)}
            <span class="date-str">${formatKoreanDate(dateStr)}</span>
          </div>
          <button class="cal-trigger" onclick="openCalSheet('${dateStr}')">📅 달력 추가</button>
        </div>
        <div>
    `;

    list.forEach(item => {
      const isChecked = checkedSet.has(item.id) || Boolean(item.is_checked);
      const cat = item.category || '준비물';
      const rawContacts = item.contacts || [];
      const needsPhoneAction = /연락|전화|문의|저장|번호/.test(item.item_text + ' ' + (item.detail || ''));
      const contacts = rawContacts.filter(c => !c.name.includes('원 대표번호') || needsPhoneAction);
      const contactHtml = contacts.length ? `
        <div class="contact-chips" onclick="event.stopPropagation()">
          ${contacts.slice(0, 3).map(c => `
            <a class="contact-pill" href="tel:${esc(c.phone.replace(/[^0-9]/g,''))}" onclick="event.stopPropagation()">
              📞 ${esc(c.name)} ${esc(c.phone)}
            </a>
            <button class="copy-mini" onclick="event.stopPropagation();copyText('${esc(c.phone)}','${esc(c.name).replace(/'/g,'')} 번호')">복사</button>
          `).join('')}
        </div>
      ` : '';

      html += `
        <div class="todo-row ${isChecked ? 'checked' : ''}">
          <button class="check-hit" onclick="toggleCheck(${item.id})" aria-label="완료 체크">
            <span class="check-circle">${isChecked ? '✓' : ''}</span>
          </button>
          <div class="todo-body" onclick="openItemDetail(${item.id})">
            <div class="todo-top">
              <span class="todo-title">${esc(item.item_text)}</span>
              <span class="cat-tag cat-${esc(cat)}">${esc(cat)}</span>
            </div>
            ${item.detail ? `<div class="todo-detail">${esc(item.detail)}</div>` : ''}
            ${contactHtml}
          </div>
          <div class="todo-chevron" onclick="openItemDetail(${item.id})" title="관련 알림장 원본 보기">›</div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  return html;
}

      </div>
    </div>
  `;
}

function render() {
  updateProgressPill();
  const box = document.getElementById('viewContainer');
  if (currentTab === 'checklist') box.innerHTML = renderChecklistView(true);
  else if (currentTab === 'calendar') box.innerHTML = renderChecklistView(false);
  else if (currentTab === 'posts') box.innerHTML = renderPostsView();
  else box.innerHTML = renderSettingsView();
}

async function loadData(notify = false) {
  try {
    const res = await fetch('./kidsnote-data.json?t=' + Date.now(), { cache: 'no-store' });
    rawData = await res.json();
    document.getElementById('syncTimeText').textContent =
      `Honeybees · ${rawData.updated_at || '방금'} 업데이트`;
    render();
    if (notify) showToast('✅ 최신 알림장·공지사항을 불러왔습니다!');
  } catch (e) {
    showToast('데이터를 불러오지 못했습니다.');
  }
}

syncRouteFromHash();
loadData();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') loadData(false);
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r => {
    r.update().catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) r.update().catch(() => {});
    });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadCtl && !reloaded) { reloaded = true; location.reload(); }
  });
}
</script>
</body>
</html>
